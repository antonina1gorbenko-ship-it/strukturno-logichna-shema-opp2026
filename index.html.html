  .node { cursor: pointer; transition: opacity .25s; }
  .node-rect { transition: stroke-width .2s, filter .2s; }
  .node.dim { opacity: 0.28; }

  .node.source-active .node-rect { stroke: #2563a8; stroke-width: 3; }
  .node.target-active .node-rect { stroke: #d9761a; stroke-width: 3; }
  .edge { transition: opacity .25s, stroke .2s, stroke-width .2s; }
  .edge.dim { opacity: 0.06; }
  .edge.in-active { stroke: #2563a8 !important; stroke-width: 2.6; opacity: 0.95; marker-end: url(#arrow-in); }
  .edge.out-active { stroke: #d9761a !important; stroke-width: 2.6; opacity: 0.95; marker-end: url(#arrow-out); }
  #reset-btn { display: block; margin: 14px auto 0; padding: 8px 18px; border-radius: 20px; border: 1px solid #ccc; background: #fafafa; color: #444; font-size: 13px; cursor: pointer; }

</style>

<script>
  const svg = document.getElementById('scheme-svg');
  const nodes = Array.from(document.querySelectorAll('.node'));
  const edges = Array.from(document.querySelectorAll('.edge'));
  let activeId = null;

  function resetAll() {
    nodes.forEach(n => n.classList.remove('dim','active','source-active','target-active'));
    edges.forEach(e => e.classList.remove('dim','in-active','out-active'));
    activeId = null;
  }

  function highlight(id) {
    resetAll();
    activeId = id;
    const inc = new Set(), out = new Set();
    edges.forEach(e => {
      const s = e.dataset.source, t = e.dataset.target;
      if (t === id) { e.classList.add('in-active'); inc.add(s); }
      else if (s === id) { e.classList.add('out-active'); out.add(t); }
      else { e.classList.add('dim'); }
    });
    nodes.forEach(n => {
      const nid = n.dataset.id;
      if (nid === id) n.classList.add('active');
      else if (inc.has(nid)) n.classList.add('source-active');
      else if (out.has(nid)) n.classList.add('target-active');
      else n.classList.add('dim');
    });
  }

  nodes.forEach(n => {
    n.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const id = n.dataset.id;
      if (activeId === id) resetAll(); else highlight(id);
    });
    n.addEventListener('keypress', (ev) => {
      if (ev.key === 'Enter') n.dispatchEvent(new Event('click', {bubbles:true}));
    });
  });
  svg.addEventListener('click', () => resetAll());
  document.getElementById('reset-btn').addEventListener('click', resetAll);
</script>
